# Interoperable Europe — Assessment report validator
#
# Test Bed validator configuration. The schemas under schemas/ are generated from
# the Assessment API's OpenAPI specification by bin/generate-schemas.py — do not
# edit them by hand. See README.md.

validator.type = submit

validator.typeLabel.submit = Assessment report — for submission to the API

# The base schema describes both the submitted and the returned report. The
# overlay adds the constraints that apply only to submission: `id` and `uri` are
# assigned by the server, and the OpenAPI spec marks them `readOnly`, which is an
# annotation rather than an assertion and so is not enforced by any validator.
validator.schemaFile.submit = schemas/Assessment.schema.json, schemas/Assessment-submit.overlay.json
validator.schemaFile.submit.combinationApproach = allOf

# The remaining component schemas, referenced by the root schema.
validator.referencedSchemas = schemas/common

# A second type for validating what the API returns is the obvious counterpart to
# `submit`, and the schemas for it are already generated. It is not enabled: every
# real API response currently fails it, because responses carry a `language`
# property that the Assessment schema does not declare while setting
# `additionalProperties: false`. Publishing it would mean shipping a validator
# that rejects the API's own output. Enable once that is resolved.
#
# validator.type = submit, published
# validator.typeLabel.published = Assessment report — as returned by the API
# validator.schemaFile.published = schemas/Assessment.schema.json

validator.uploadTitle = Interoperable Europe — Assessment report validator

validator.channels = form, rest_api

validator.locale.available = en
validator.locale.default = en

validator.richTextReports = true
